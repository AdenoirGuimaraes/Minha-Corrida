# Gera o APK do Minha Corrida na nuvem (GitHub Actions) a cada envio para o repositório.
# O APK fica em "Releases" > "ultima-versao" para baixar direto no celular.
name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Testes do núcleo
        run: gradle :core:test --no-daemon

      - name: Gerar APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Publicar APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MinhaCorrida.apk
          gh release delete ultima-versao -y --cleanup-tag || true
          gh release create ultima-versao MinhaCorrida.apk \
            --title "Minha Corrida (última versão)" \
            --notes "APK gerado automaticamente em $(date -u '+%d/%m/%Y %H:%M') UTC"
